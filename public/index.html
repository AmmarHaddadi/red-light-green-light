<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squid Game: Red Light, Green Light</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="landing-container">
    <div class="symbols">○ △ □</div>
    <h1 class="landing-title">Red Light<br><span style="color: var(--squid-pink)">Green Light</span></h1>
    <p class="landing-subtitle">Real-time mobile motion party game</p>

    <div class="landing-actions">
      <a href="/play" class="btn btn-primary">
        📱 Enter Arena as Player
      </a>
      <a href="/admin" class="btn btn-secondary">
        🖥️ Open Admin Dashboard
      </a>
    </div>

    <div style="margin-top: 48px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;">
      <p>⚠️ Players must join on a mobile smartphone with motion sensors enabled.</p>
      <p>During Red Light, any movement triggers an instant alarm & elimination!</p>
    </div>
  </div>
</body>
</html>
